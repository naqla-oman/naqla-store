# منصة نقلة على خادم واحد: Caddy + Postgres + Redis + (خلفية + واجهة) لكل متجر.
# الأساس المشترك فقط. خدمات كل متجر في deploy/stores/<slug>.compose.yml (يولّدها pnpm store:deploy، خارج Git).
# التشغيل: deploy/up.sh <slug>
name: naqla

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10
    <<: *restart
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # مواقع المتاجر المولَّدة بـ store:deploy (خارج Git)
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16
    <<: *restart
    environment:
      POSTGRES_USER: naqla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في deploy/.env}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naqla"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
