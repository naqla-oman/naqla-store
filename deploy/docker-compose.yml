# منصة نقلة على خادم واحد — الأساس المشترك: Caddy + Postgres + Redis + لوحة نقلة (الويب والمنفّذ).
# خدمات كل متجر في deploy/stores/<slug>.compose.yml وموقعه في deploy/sites/<slug>.caddy (يولّدهما
# deploy/naqla.mjs، خارج Git). المستودع على الخادم في /opt/naqla (المنفّذ يدير Docker بالمسارات نفسها).
# التثبيت الأول: deploy/install.sh — والعمليات بعده: deploy/naqla.sh <أمر>
name: naqla

x-restart: &restart
  restart: unless-stopped
  logging: { driver: local, options: { max-size: 20m, max-file: "5" } }

x-console-env: &console-env
  NODE_ENV: production
  CONSOLE_DATABASE_URL: postgres://naqla:${POSTGRES_PASSWORD:?}@postgres:5432/naqla_console
  CONSOLE_DRIVER: docker
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?ضع PLATFORM_DOMAIN في deploy/.env}
  PLATFORM_IP: ${PLATFORM_IP:-}
  # خلف Caddy: عنوان العميل من X-Forwarded-For (قرار 13)
  TRUST_PROXY: "1"
  CONSOLE_WHATSAPP_TOKEN: ${CONSOLE_WHATSAPP_TOKEN:-}
  CONSOLE_WHATSAPP_PHONE_ID: ${CONSOLE_WHATSAPP_PHONE_ID:-}
  CONSOLE_WHATSAPP_TPL_STORE_READY: ${CONSOLE_WHATSAPP_TPL_STORE_READY:-}
  TZ: Asia/Muscat

services:
  caddy:
    image: caddy:2.10
    <<: *restart
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-info@naqla.tech}
      CONSOLE_DOMAIN: console.${PLATFORM_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

  postgres:
    image: postgres:16
    <<: *restart
    environment:
      POSTGRES_USER: naqla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في deploy/.env}
      TZ: Asia/Muscat
    volumes: [pg_data:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naqla"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *restart
    # المتاجر تتشارك خادماً واحداً ببادئة لكل متجر (medusa-config)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  console:
    image: naqla-console
    build: { context: .., dockerfile: deploy/console.Dockerfile }
    <<: *restart
    environment: *console-env
    # الويب يقرأ القوالب والعملاء فقط — لا مقبس Docker (قرار 7)
    volumes:
      - ../clients:/opt/naqla/clients:ro
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }

  console-worker:
    image: naqla-console
    <<: *restart
    command: ["npx", "tsx", "worker/index.ts"]
    environment: *console-env
    # المنفّذ وحده يملك Docker؛ بيانات الخادم مركّبة بمساراتها على الخادم نفسها
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../clients:/opt/naqla/clients
      - ../.stores:/opt/naqla/.stores
      - ../data:/opt/naqla/data
      - ../.backups:/opt/naqla/.backups
      - ../.archive:/opt/naqla/.archive
      - ./stores:/opt/naqla/deploy/stores
      - ./sites:/opt/naqla/deploy/sites
      - ./.env:/opt/naqla/deploy/.env:ro
    mem_limit: 320m
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
